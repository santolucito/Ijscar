remote_theme: pages-themes/tactile@v0.2.0
plugins:
- jekyll-remote-theme # add this line to the plugins list if you already have one
- jekyll-sitemap
title: IJSCAR International Journal of Secondary Computing and Applications Research
description: A High School Computer Science Journal
show_downloads: false
google_analytics: G-V1H1997MQ5

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Files and folders that should NOT be published on ijscar.org.
# (Setting this list replaces Jekyll's defaults, so those are repeated here.)
exclude:
  - "Claude outputs"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
